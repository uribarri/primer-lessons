<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440">
  <defs>
    <linearGradient id="parchment-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#f2e8d5"/>
    </linearGradient>
    <pattern id="woodcut-crosshatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#1c1917" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="8" y2="0" stroke="#1c1917" stroke-width="0.8"/>
    </pattern>
    <pattern id="woodcut-hatch-light" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#292524" stroke-width="1.0"/>
    </pattern>
    <pattern id="water-etching" width="6" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="3" x2="6" y2="3" stroke="#1c1917" stroke-width="1.2"/>
    </pattern>
  </defs>
  <!-- Background Parchment -->
  <rect width="640" height="440" fill="url(#parchment-grad)"/>
  <!-- Double Engraved Border Frame -->
  <rect x="8" y="8" width="624" height="424" fill="none" stroke="#1c1917" stroke-width="2.5"/>
  <rect x="13" y="13" width="614" height="414" fill="none" stroke="#1c1917" stroke-width="0.8"/>
  <!-- Header Title -->
  <text x="24" y="38" fill="#1c1917" font-family="'Georgia', 'Times New Roman', serif" font-size="17" font-weight="bold" letter-spacing="1">
    WATER VASES
  </text>
  <text x="24" y="54" fill="#57534e" font-family="'Georgia', 'Times New Roman', serif" font-size="11" font-style="italic">
    Fig. 1 — Deterministic Mechanical Engraving
  </text>
  <line x1="30" y1="360.0" x2="610" y2="360.0" stroke="#1c1917" stroke-width="2.5"/>
  <line x1="30" y1="160.0" x2="610" y2="160.0" stroke="#1c1917" stroke-width="2" stroke-dasharray="8,4"/>
  <rect x="160.0" y="136.0" width="320" height="22" rx="2" fill="#fdfbf7" stroke="#1c1917" stroke-width="1.5"/>
  <text x="320.0" y="151.0" fill="#1c1917" font-family="'Georgia', 'Times New Roman', serif" font-size="12" font-weight="bold" letter-spacing="0.5" text-anchor="middle">★ LCM TARGET LEVEL = 12 LITERS ★</text>
  <!-- Vase: Vase A -->
  <g id="element-Vase A">
    <rect x="93.0" y="310.0" width="74.0" height="49.0" fill="url(#water-etching)" rx="1"/>
    <line x1="90.0" y1="310.0" x2="170.0" y2="310.0" stroke="#1c1917" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="176.0" y="314.0" fill="#1c1917" font-family="'Georgia', 'Times New Roman', serif" font-size="11" font-weight="bold">3L</text>
    <rect x="93.0" y="260.0" width="74.0" height="49.0" fill="url(#water-etching)" rx="1"/>
    <line x1="90.0" y1="260.0" x2="170.0" y2="260.0" stroke="#1c1917" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="176.0" y="264.0" fill="#1c1917" font-family="'Georgia', 'Times New Roman', serif" font-size="11" font-weight="bold">6L</text>
    <rect x="93.0" y="210.0" width="74.0" height="49.0" fill="url(#water-etching)" rx="1"/>
    <line x1="90.0" y1="210.0" x2="170.0" y2="210.0" stroke="#1c1917" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="176.0" y="214.0" fill="#1c1917" font-family="'Georgia', 'Times New Roman', serif" font-size="11" font-weight="bold">9L</text>
    <rect x="93.0" y="160.0" width="74.0" height="49.0" fill="url(#water-etching)" rx="1"/>
    <line x1="90.0" y1="160.0" x2="170.0" y2="160.0" stroke="#1c1917" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="176.0" y="164.0" fill="#1c1917" font-family="'Georgia', 'Times New Roman', serif" font-size="11" font-weight="bold">12L</text>
    <rect x="90.0" y="160.0" width="80.0" height="200.0" fill="none" stroke="#1c1917" stroke-width="2.5" rx="3"/>
    <text x="130.0" y="380.0" fill="#1c1917" font-family="'Georgia', 'Times New Roman', serif" font-size="13" font-weight="bold" text-anchor="middle">Vase A</text>
    <text x="130.0" y="396.0" fill="#292524" font-family="'Georgia', 'Times New Roman', serif" font-size="11" font-style="italic" text-anchor="middle">Capacity: 3 Liters</text>
    <text x="130.0" y="410.0" fill="#57534e" font-family="'Georgia', 'Times New Roman', serif" font-size="10" text-anchor="middle">(4 pours to reach 12L)</text>
  </g>
  <!-- Vase: Vase B -->
  <g id="element-Vase B">
    <rect x="283.0" y="293.3" width="74.0" height="65.7" fill="url(#water-etching)" rx="1"/>
    <line x1="280.0" y1="293.3" x2="360.0" y2="293.3" stroke="#1c1917" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="366.0" y="297.3" fill="#1c1917" font-family="'Georgia', 'Times New Roman', serif" font-size="11" font-weight="bold">4L</text>
    <rect x="283.0" y="226.7" width="74.0" height="65.7" fill="url(#water-etching)" rx="1"/>
    <line x1="280.0" y1="226.7" x2="360.0" y2="226.7" stroke="#1c1917" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="366.0" y="230.7" fill="#1c1917" font-family="'Georgia', 'Times New Roman', serif" font-size="11" font-weight="bold">8L</text>
    <rect x="283.0" y="160.0" width="74.0" height="65.7" fill="url(#water-etching)" rx="1"/>
    <line x1="280.0" y1="160.0" x2="360.0" y2="160.0" stroke="#1c1917" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="366.0" y="164.0" fill="#1c1917" font-family="'Georgia', 'Times New Roman', serif" font-size="11" font-weight="bold">12L</text>
    <rect x="280.0" y="160.0" width="80.0" height="200.0" fill="none" stroke="#1c1917" stroke-width="2.5" rx="3"/>
    <text x="320.0" y="380.0" fill="#1c1917" font-family="'Georgia', 'Times New Roman', serif" font-size="13" font-weight="bold" text-anchor="middle">Vase B</text>
    <text x="320.0" y="396.0" fill="#292524" font-family="'Georgia', 'Times New Roman', serif" font-size="11" font-style="italic" text-anchor="middle">Capacity: 4 Liters</text>
    <text x="320.0" y="410.0" fill="#57534e" font-family="'Georgia', 'Times New Roman', serif" font-size="10" text-anchor="middle">(3 pours to reach 12L)</text>
  </g>
  <!-- Vase: Vase C -->
  <g id="element-Vase C">
    <rect x="473.0" y="260.0" width="74.0" height="99.0" fill="url(#water-etching)" rx="1"/>
    <line x1="470.0" y1="260.0" x2="550.0" y2="260.0" stroke="#1c1917" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="556.0" y="264.0" fill="#1c1917" font-family="'Georgia', 'Times New Roman', serif" font-size="11" font-weight="bold">6L</text>
    <rect x="473.0" y="160.0" width="74.0" height="99.0" fill="url(#water-etching)" rx="1"/>
    <line x1="470.0" y1="160.0" x2="550.0" y2="160.0" stroke="#1c1917" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="556.0" y="164.0" fill="#1c1917" font-family="'Georgia', 'Times New Roman', serif" font-size="11" font-weight="bold">12L</text>
    <rect x="470.0" y="160.0" width="80.0" height="200.0" fill="none" stroke="#1c1917" stroke-width="2.5" rx="3"/>
    <text x="510.0" y="380.0" fill="#1c1917" font-family="'Georgia', 'Times New Roman', serif" font-size="13" font-weight="bold" text-anchor="middle">Vase C</text>
    <text x="510.0" y="396.0" fill="#292524" font-family="'Georgia', 'Times New Roman', serif" font-size="11" font-style="italic" text-anchor="middle">Capacity: 6 Liters</text>
    <text x="510.0" y="410.0" fill="#57534e" font-family="'Georgia', 'Times New Roman', serif" font-size="10" text-anchor="middle">(2 pours to reach 12L)</text>
  </g>
</svg>